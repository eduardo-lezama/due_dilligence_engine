[project]
name = "due-diligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50.0",
    "openai>=1.50.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "edgartools==5.59.1",
    "tavily-python>=0.3.0",
    "polygon-api-client>=1.0.0",
    "finnhub-python>=2.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "rapidfuzz>=3.14",  # validation/citations.py (ADR-032): fuzzy match de excerpts
    "lxml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6",
]

[project.scripts]
due-diligence = "due_diligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/due_diligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Conjunto clásico de ruff (errores de pycodestyle + pyflakes), fijado explícitamente: las versiones
# nuevas de ruff amplían los defaults con reglas de estilo (orden de imports, dict()) que no aportan
# detección de bugs a este proyecto.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Los tests agrupan imports por sección (un bloque de imports por grupo de tests): convención aceptada.
"tests/*" = ["E402"]

[tool.pyright]
# Bloque C (C6): comprobación de tipos en modo básico sobre los módulos que ya están limpios (la capa de
# decisión y lo nuevo). Se amplía módulo a módulo: añadir uno solo cuando dé 0 errores, sin "type: ignore"
# genéricos. Pendientes (2026-10-17, ~170 errores): tools/edgar.py (atributos sin tipar de edgartools),
# tools/accounting_scores.py y tools/xbrl_extract.py (opcionales que el código ya protege), archiver, cli.
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = [
    "src/due_diligence/agents/valuation.py",
    "src/due_diligence/agents/valuation_math.py",
    "src/due_diligence/agents/verdict_policy.py",
    "src/due_diligence/agents/report_facts.py",
    "src/due_diligence/agents/peers.py",
    "src/due_diligence/tools/tenk_sections.py",
    "src/due_diligence/tools/news_relevance.py",
    "src/due_diligence/tools/fred.py",
    "src/due_diligence/evals/outcomes.py",
    "src/due_diligence/utils/periods.py",
    "src/due_diligence/validation/citations.py",
]

