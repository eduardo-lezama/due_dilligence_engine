[project]
name = "due-diligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50.0",
    "openai>=1.50.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "edgartools==5.59.1",
    "tavily-python>=0.3.0",
    "polygon-api-client>=1.0.0",
    "finnhub-python>=2.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "rapidfuzz>=3.14",  # validation/citations.py (ADR-032): fuzzy match de excerpts
    "lxml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
due-diligence = "due_diligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/due_diligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"
